- reifier_id: reifier_mustard_bin_separation
  source_id: mustard_bottle
  relation_type: SPATIAL_SEPARATION
  target_id: grey_bin
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.0
  required_friction: 0.0
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 1.5
  posterior_entropy: 0.1
  evidence_sources:
  - collision_avoidance
  - manipulation_clearance
task:
  composition: atomic
  description: Droid robot picks up the mustard bottle from the maple table and places
    it into the grey bin.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mustard_bottle
      destination_location: grey_bin
      background_scene: maple_table
