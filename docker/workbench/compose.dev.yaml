services:
  frontend:
    build:
      target: development
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - type: bind
        source: ${WORKBENCH_SOURCE_HOST:?discover the host frontend source}
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: frontend_deps
        target: /app/node_modules
volumes:
  frontend_deps:
