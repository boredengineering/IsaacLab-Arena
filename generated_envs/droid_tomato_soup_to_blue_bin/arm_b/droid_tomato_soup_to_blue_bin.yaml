env_name: tomato_soup_pick_place_maple_table
embodiment:
  id: franka_robot
  registry_name: droid_rel_joint_pos
  params:
    initial_pose:
      position_xyz:
      - -0.55
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: maple_table
  registry_name: maple_table_robolab
  params: {}
objects:
- id: tomato_soup_can
  registry_name: tomato_soup_can_ycb_robolab
  params: {}
- id: container
  registry_name: bin_b03_vomp_robolab
  params: {}
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: 'on'
  subject: tomato_soup_can
  reference: maple_table
  params:
    surface_anchor: table_top
    surface_sector: front_center
- kind: 'on'
  subject: container
  reference: maple_table
  params:
    surface_anchor: table_top
    surface_sector: rear_center
reified_relations:
- reifier_id: can_on_table
  source_id: tomato_soup_can
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: front_center
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.1
  required_friction: 0.5
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 1.8
  posterior_entropy: 0.02
  evidence_sources:
  - tabletop_spatial_planner
- reifier_id: container_on_table
  source_id: container
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: rear_center
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.15
  required_friction: 0.65
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.0
  posterior_entropy: 0.03
  evidence_sources:
  - tabletop_spatial_planner
task:
  composition: atomic
  description: Franka robot picks up a tomato soup can from the maple table and places
    it into a compact tabletop container on the same table.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: tomato_soup_can
      destination_location: container
      background_scene: maple_table
