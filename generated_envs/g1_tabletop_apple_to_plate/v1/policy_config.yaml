language_instruction: Create an environment for a Unitree G1 humanoid robot on a maple
  table where the task is to reach with the right arm to grasp the red apple from
  the front right of the table and place it onto the clay plate on the front left.
  Position the maple table at [0.0, 0.0, 0.0] and use embodiment g1_wbc_agile_pink
  standing at [-0.45, 0.0, 0.0] facing the table, with head camera robot_head_cam_rgb.
