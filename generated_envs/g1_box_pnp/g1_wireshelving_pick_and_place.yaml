env_name: g1_wireshelving_pick_and_place
embodiment:
  id: robot
  registry_name: g1_wbc_pink
  params: {}
background:
  id: galileo_room
  registry_name: galileo
  params: {}
objects:
- id: wireshelving
  registry_name: wireshelving_a01_vomp_robolab
  params:
    initial_pose:
      position_xyz:
      - 0.0
      - 1.1
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- id: brown_box
  registry_name: brown_box
  params: {}
- id: blue_sorting_bin
  registry_name: blue_sorting_bin
  params:
    initial_pose:
      position_xyz:
      - 0.6
      - 0.8
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
relations:
- kind: is_anchor
  subject: galileo_room
  params: {}
- kind: is_anchor
  subject: wireshelving
  params: {}
- kind: is_anchor
  subject: blue_sorting_bin
  params: {}
- kind: 'on'
  subject: brown_box
  reference: wireshelving
  params: {}
- kind: next_to
  subject: blue_sorting_bin
  reference: wireshelving
  params: {}
task:
  composition: atomic
  description: Unitree G1 humanoid pick up brown box from the wireshelving in galileo
    room and place it into the blue sorting bin
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: brown_box
      destination_location: blue_sorting_bin
      background_scene: galileo_room
