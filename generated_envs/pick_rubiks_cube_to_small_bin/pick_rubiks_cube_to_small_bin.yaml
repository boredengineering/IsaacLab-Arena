env_name: pick_rubiks_cube_to_small_bin
embodiment:
  id: robot_droid
  registry_name: droid_abs_joint_pos
  params:
    initial_pose:
      position_xyz:
      - 0.0
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: maple_table
  registry_name: maple_table_robolab
  params:
    hdr: home_office_robolab
    light_intensity: 500.0
    directional_light_on: true
    initial_pose:
      position_xyz:
      - -0.15
      - 0.0
      - 0.0
objects:
- id: rubiks_cube
  registry_name: rubiks_cube_hot3d_robolab
  params:
    initial_pose:
      position_xyz:
      - 0.45
      - -0.09
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- id: small_bin
  registry_name: bin_b03_vomp_robolab
  params:
    initial_pose:
      position_xyz:
      - 0.45
      - 0.14
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: 'on'
  subject: rubiks_cube
  reference: maple_table
  params:
    surface_sector: front_center
- kind: 'on'
  subject: small_bin
  reference: maple_table
  params:
    surface_sector: front_left
reified_relations:
- reifier_id: reifier_rubiks_cube_table
  source_id: rubiks_cube
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: front_center
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: 0.35
    max_val: 0.55
    nominal: 0.45
  delta_y:
    min_val: -0.25
    max_val: -0.06
    nominal: -0.13
  delta_z:
    min_val: 0.0
    max_val: 0.02
    nominal: 0.0
  required_headroom: 0.25
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - qwen2_5_vl_active_inference
  - usd_stage_introspection
  - neo4j_graph_rag
- reifier_id: reifier_small_bin_table
  source_id: small_bin
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: front_left
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: 0.35
    max_val: 0.55
    nominal: 0.45
  delta_y:
    min_val: 0.06
    max_val: 0.25
    nominal: 0.14
  delta_z:
    min_val: 0.0
    max_val: 0.02
    nominal: 0.0
  required_headroom: 0.25
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - qwen2_5_vl_active_inference
  - usd_stage_introspection
  - neo4j_graph_rag
task:
  composition: atomic
  description: Pick up the rubiks cube from the right side of the maple table and
    place it inside the small bin on the left.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: rubiks_cube
      destination_location: small_bin
      background_scene: maple_table
      episode_length_s: 40.0
