env_name: droid_pick_mustard_to_bin
embodiment:
  id: droid_robot
  registry_name: droid_abs_joint_pos
  params:
    initial_pose:
      position_xyz:
      - -0.55
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: maple_table
  registry_name: maple_table_robolab
  params: {}
objects:
- id: mustard_bottle
  registry_name: mustard_bottle_hope_robolab
  params: {}
- id: grey_bin
  registry_name: grey_bin_robolab
  params:
    initial_pose:
      position_xyz:
      - 0.6
      - 0.8
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: is_anchor
  subject: grey_bin
  params: {}
- kind: 'on'
  subject: mustard_bottle
  reference: maple_table
  params:
    surface_anchor: table_top
- kind: requires_reachability
  subject: mustard_bottle
  params: {}
- kind: requires_reachability
  subject: grey_bin
  params: {}
reified_relations:
- reifier_id: reifier_mustard_table
  source_id: mustard_bottle
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.25
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.8
  posterior_entropy: 0.05
  evidence_sources:
  - tabletop_spatial_planner
- reifier_id: reifier_bin_table
  source_id: grey_bin
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.3
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.8
  posterior_entropy: 0.05
  evidence_sources:
