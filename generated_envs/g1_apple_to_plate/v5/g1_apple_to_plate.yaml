env_name: g1_kitchen_apple_to_plate
embodiment:
  id: g1_robot
  registry_name: g1_wbc_agile_joint
  params:
    initial_pose:
      position_xyz:
      - -0.4
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: kitchen_island
  registry_name: table
  params: {}
objects:
- id: red_apple
  registry_name: apple_01_objaverse_robolab
  params:
    scale:
    - 0.009
    - 0.009
    - 0.009
- id: plate
  registry_name: clay_plates_hot3d_robolab
  params:
    scale:
    - 0.5
    - 0.5
    - 0.5
relations:
- kind: is_anchor
  subject: kitchen_island
  params: {}
- kind: 'on'
  subject: red_apple
  reference: kitchen_island
  params:
    surface_sector: front_right
- kind: 'on'
  subject: plate
  reference: kitchen_island
  params:
    surface_sector: front_left
- kind: requires_reachability
  subject: red_apple
  params: {}
- kind: requires_reachability
  subject: plate
  params: {}
task:
  composition: atomic
  description: Unitree G1 reaches with the right arm to grasp the red apple from the table and place it onto the plate
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: red_apple
      destination_location: plate
      background_scene: kitchen_island
