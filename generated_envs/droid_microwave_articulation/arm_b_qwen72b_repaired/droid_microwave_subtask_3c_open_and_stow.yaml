env_name: microwave_campbell_soup_placement
embodiment:
  id: robot
  registry_name: droid_abs_joint_pos
  params:
    initial_pose:
      position_xyz:
      - -0.55
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: maple_table
  registry_name: maple_table_robolab
  params: {}
objects:
- id: tomato_soup_can
  registry_name: tomato_soup_can_ycb_robolab
  params: {}
- id: microwave
  registry_name: microwave
  params: {}
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: 'on'
  subject: tomato_soup_can
  reference: maple_table
  params:
    surface_anchor: table_top
    surface_sector: front_right
- kind: 'on'
  subject: microwave
  reference: maple_table
  params:
    surface_anchor: table_top
    surface_sector: center
reified_relations:
- reifier_id: reifier_tomato_soup_can_table
  source_id: tomato_soup_can
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: front_right
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.20
    max_val: -0.10
    nominal: -0.15
  delta_y:
    min_val: -0.35
    max_val: -0.25
    nominal: -0.30
  delta_z:
    min_val: 0.0
    max_val: 0.02
    nominal: 0.01
  required_headroom: 0.35
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - tabletop_spatial_planner
- reifier_id: reifier_microwave_table
  source_id: microwave
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: center
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: 0.10
    max_val: 0.20
    nominal: 0.15
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.02
    nominal: 0.01
  required_headroom: 0.35
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - tabletop_spatial_planner
placement_validators:
  enabled_checks:
  - non_overlap
  - reachability
  - headroom
  required_checks:
  - non_overlap
  - reachability
  - headroom
task:
  composition: sequential
  description: Reach out to the microwave, pull the door open, then grasp the tomato soup can and place it inside on the turntable tray.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: microwave
      openness_threshold: 0.83
  - kind: PickAndPlaceTask
    params:
      pick_up_object: tomato_soup_can
      destination_location: microwave
      background_scene: maple_table
