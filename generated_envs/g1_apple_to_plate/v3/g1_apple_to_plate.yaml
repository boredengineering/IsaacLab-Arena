env_name: g1_kitchen_apple_to_plate
embodiment:
  id: g1_robot
  registry_name: g1_wbc_agile_joint
  params:
    initial_pose:
      position_xyz:
      - 0.0
      - -0.75
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: kitchen_island
  registry_name: kitchen
  params: {}
objects:
- id: red_apple
  registry_name: apple_01_objaverse_robolab
  params:
    scale:
    - 0.009
    - 0.009
    - 0.009
    initial_pose:
      position_xyz:
      - 0.5785
      - 0.27
      - 0.75
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- id: plate
  registry_name: clay_plates_hot3d_robolab
  params:
    scale:
    - 0.5
    - 0.5
    - 0.5
    initial_pose:
      position_xyz:
      - 0.5785
      - 0.06
      - 0.75
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
relations:
- kind: is_anchor
  subject: kitchen_island
  params: {}
- kind: 'on'
  subject: red_apple
  reference: kitchen_island
  params:
    surface_anchor: counter_top
    surface_sector: front_center
- kind: 'on'
  subject: plate
  reference: kitchen_island
  params:
    surface_anchor: counter_top
    surface_sector: front_left
- kind: requires_reachability
  subject: red_apple
  params: {}
- kind: requires_reachability
  subject: plate
  params: {}
reified_relations:
- reifier_id: reifier_apple_counter
  source_id: red_apple
  relation_type: PLACED_ON
  target_id: kitchen_island
  surface_anchor: counter_top
  surface_sector: front_center
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.3
  required_friction: 0.65
  kinematic_manifold: countertop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - kitchen_spatial_planner
  - right_arm_reachability
  - camera_fov_constraint
- reifier_id: reifier_plate_counter
  source_id: plate
  relation_type: PLACED_ON
  target_id: kitchen_island
  surface_anchor: counter_top
  surface_sector: front_left
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.25
  required_friction: 0.7
  kinematic_manifold: countertop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - kitchen_spatial_planner
  - right_arm_reachability
  - camera_fov_constraint
- reifier_id: reifier_apple_plate_placement
  source_id: red_apple
  relation_type: DESTINATION_FOR
  target_id: plate
  surface_anchor: plate_center
  surface_sector: center
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_y:
    min_val: -0.05
    max_val: 0.05
    nominal: 0.0
  delta_z:
    min_val: 0.0
    max_val: 0.03
    nominal: 0.01
  required_headroom: 0.15
  required_friction: 0.6
  kinematic_manifold: plate_placement_stable
  prior_entropy: 1.5
  posterior_entropy: 0.03
  evidence_sources:
  - task_goal_specification
  - object_stability_model
task:
  composition: atomic
  description: Unitree G1 humanoid robot uses its right arm to grasp the red apple
    from the front-center section of the kitchen counter and place it onto the plate
    located on the front-left section of the counter.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: red_apple
      destination_location: plate
      background_scene: kitchen_island
