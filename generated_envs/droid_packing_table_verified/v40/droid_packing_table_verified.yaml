env_name: droid_banana_to_red_bowl
embodiment:
  id: droid_robot
  registry_name: droid_abs_joint_pos
  params:
    initial_pose:
      position_xyz:
      - -0.3741
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: maple_table
  registry_name: maple_table_robolab
  params: {}
objects:
- id: yellow_banana
  registry_name: banana_ycb_robolab
  params:
    initial_pose:
      position_xyz:
      - 0.2892
      - -0.1421
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- id: red_bowl
  registry_name: bowl_ycb_robolab
