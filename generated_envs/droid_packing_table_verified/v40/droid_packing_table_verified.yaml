  target_id: maple_table
  surface_anchor: table_top
  surface_sector: front_right
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: 0.3
    max_val: 0.8
    nominal: 0.45
  delta_y:
    min_val: -0.3
    max_val: 0.3
    nominal: -0.15
  delta_z:
    min_val: 0.0
    max_val: 0.05
    nominal: 0.025
  required_headroom: 0.35
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - tabletop_spatial_planner
- reifier_id: reifier_bowl_table
  source_id: red_bowl
  relation_type: PLACED_ON
  target_id: maple_table
  surface_anchor: table_top
  surface_sector: front_left
  contact_normal:
  - 0.0
  - 0.0
  - 1.0
  delta_x:
    min_val: 0.3
    max_val: 0.8
    nominal: 0.45
  delta_y:
    min_val: -0.3
    max_val: 0.3
    nominal: 0.15
  delta_z:
    min_val: 0.0
    max_val: 0.05
    nominal: 0.025
  required_headroom: 0.35
  required_friction: 0.6
  kinematic_manifold: tabletop_stationary_reach
  prior_entropy: 2.5
  posterior_entropy: 0.05
  evidence_sources:
  - tabletop_spatial_planner
placement_validators:
  enabled_checks:
  - non_overlap_validator
  - reachability_validator
  required_checks:
  - non_overlap_validator
  - reachability_validator
task:
  composition: atomic
  description: DROID robot grasps the yellow banana from the front right side of the
    maple table and places it into the red bowl on the front left side of the table.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: yellow_banana
      destination_location: red_bowl
      background_scene: maple_table
