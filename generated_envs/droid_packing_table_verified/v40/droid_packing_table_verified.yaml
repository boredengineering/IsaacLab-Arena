      position_xyz:
      - 0.2892
      - 0.1421
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: 'on'
  subject: yellow_banana
  reference: maple_table
  params:
    surface_anchor: table_top
    surface_sector: front_right
- kind: 'on'
  subject: red_bowl
  reference: maple_table
  params:
    surface_anchor: table_top
    surface_sector: front_left
