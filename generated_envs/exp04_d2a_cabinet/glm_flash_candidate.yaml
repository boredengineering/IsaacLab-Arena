  - reachability_envelope_0.30_0.80m
  required_checks:
  - no_overlap_with_drawer_stroke_corridor
  - reachability_envelope_0.30_0.80m
task:
  composition: sequential
  description: Pull the integrated sliding drawer of the kitchen base cabinet outward
    along its prismatic slide axis by at least 0.25m, then pick up the tomato soup
    can from the worktop deck and stow it securely inside the open drawer cavity.
    The robot base and the staged can remain outside the drawer's linear pull-out
    stroke corridor.
  subtasks:
  - kind: OpenDrawerTask
    params:
      openable_object: kitchen_base_cabinet
      background_scene: kitchen_base_cabinet
      stroke_threshold: 0.25
  - kind: PickAndPlaceTask
    params:
      pick_up_object: tomato_soup_can
      destination_location: kitchen_base_cabinet
      background_scene: kitchen_base_cabinet
      object_references: []
      destination_surface_anchor: drawer_cavity
      destination_surface_sector: front_center
cli_override_specs: []
